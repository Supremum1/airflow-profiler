global:
  scrape_interval: 2s

scrape_configs:
  - job_name: airflow-cgroups
    scrape_interval: 1s
    scrape_timeout: 1s
    static_configs:
      - targets: [resource-metrics:9199]
  - job_name: airflow
    static_configs:
      - targets: [statsd:9102]
  - job_name: metadata-postgres
    scrape_interval: 10s
    static_configs:
      - targets: [postgres-exporter:9187]
